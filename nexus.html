<!DOCTYPE html>
<html lang="ja" itemtype="http://schema.org/WebPage">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>NEXUS — Page Index (nemonowa default)</title>
<meta name="theme-color" content="#1e28d2" />
<link rel="icon" href="/icon.png" />
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
:root {
  --bg-1: linear-gradient(180deg, #071028 0%, #0b1430 40%, #08122a 100%);
  --muted: rgba(230, 238, 246, 0.6);
  --card-bg: rgba(255, 255, 255, 0.02);
  --accent: #6ee7b7;
}
html, body {
  height: 100%;
  margin: 0;
  background: var(--bg-1);
  font-family: "DM Mono", monospace;
  color: #e6eef6;
  overflow-x: hidden;
}
#nexus-root {
  max-width: 1000px;
  width: 95%;
  margin: 28px auto;
  padding: 10px;
  box-sizing: border-box;
}
#nexus-root header {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 12px;
  border-radius: 12px;
  background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
  border: 1px solid rgba(255,255,255,0.03);
  box-shadow: 0 10px 30px rgba(2,6,23,0.6);
}
#nexus-root .brand {
  display: flex;
  gap: 12px;
  align-items: center;
}
#nexus-root .brand .mark {
  width: 56px;
  height: 56px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  background: conic-gradient(from 200deg, rgba(124,92,255,0.18), rgba(110,231,183,0.06));
}
#nexus-root h1 {
  font-size: 1.1rem;
  margin: 0;
}
#nexus-root p.lead {
  margin: 0;
  color: var(--muted);
  font-size: 0.85rem;
}
#nexus-root .controls {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
#nexus-root .controls input[type="text"] {
  background: transparent;
  border: 1px solid rgba(255,255,255,0.03);
  padding: 8px 10px;
  border-radius: 8px;
  color: inherit;
  outline: none;
  flex: 1 1 120px;
  min-width: 100px;
}
#nexus-root .controls button {
  background: transparent;
  border: 1px solid rgba(255,255,255,0.06);
  padding: 8px 12px;
  border-radius: 8px;
  color: inherit;
  cursor: pointer;
}
#nexus-root .hero {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin: 16px 0;
  padding: 14px;
  border-radius: 12px;
  background: linear-gradient(180deg, var(--card-bg), transparent);
  border: 1px solid rgba(255,255,255,0.03);
}
#nexus-root .content-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 14px;
  margin-top: 12px;
}
#nexus-root .card {
  padding: 12px;
  border-radius: 12px;
  background: linear-gradient(180deg, rgba(255,255,255,0.01), transparent);
  border: 1px solid rgba(255,255,255,0.03);
  min-height: 140px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
}
#nexus-root .card:hover {
  transform: translateY(-6px);
  box-shadow: 0 18px 40px rgba(2,6,23,0.6);
}
#nexus-root .thumb {
  width: 100%;
  aspect-ratio: 2 / 1;
  border-radius: 8px;
  background: rgba(255,255,255,0.02);
  display: grid;
  place-items: center;
  overflow: hidden;
}
#nexus-root .thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
#nexus-root .meta {
  color: var(--accent);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  font-size: 0.85rem;
}
#nexus-root .list-view { display: none; flex-direction: column; gap: 8px; }
#nexus-root .list-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px;
  border-radius: 10px;
  background: rgba(255,255,255,0.01);
  border: 1px solid rgba(255,255,255,0.02);
}
#nexus-root .pagination {
  display: flex;
  gap: 8px;
  align-items: center;
  justify-content: center;
  margin-top: 14px;
  flex-wrap: wrap;
}
#nexus-root .pagination button {
  padding: 8px 12px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.04);
  background: transparent;
  color: inherit;
  cursor: pointer;
}
#nexus-root .modal {
  position: fixed;
  inset: 0;
  background: rgba(2,6,23,0.7);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1200;
}
#nexus-root .modal img {
  max-width: 90%;
  max-height: 85%;
  border-radius: 10px;
  box-shadow: 0 20px 60px rgba(2,6,23,0.8);
}
footer {
  margin-top: 18px;
  padding: 12px;
  border-radius: 10px;
  background: linear-gradient(180deg, rgba(255,255,255,0.01), transparent);
  border: 1px solid rgba(255,255,255,0.03);
  text-align: center;
  color: var(--muted);
  font-size: 0.9rem;
}
.muted { color: var(--muted); }
.btn-small {
  padding: 6px 8px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.04);
  background: transparent;
  color: inherit;
  font-size: 0.85rem;
  cursor: pointer;
}
</style>
</head>
<body>
<div id="nexus-root" role="main" aria-labelledby="page-title">
<header role="banner">
  <div class="brand">
    <div class="mark" id="logo" title="NEXUS" aria-hidden="true"></div>
    <div>
      <h1 id="page-title">NEXUS — Page Index</h1>
      <p class="lead">`nemonowa.github.io/source/page` を初期で読み込みます — 12件/ページ</p>
    </div>
  </div>
  <div class="controls">
    <input id="owner" type="text" placeholder="owner" value="nemonowa"/>
    <input id="repo" type="text" placeholder="repo" value="nemonowa.github.io"/>
    <input id="path" type="text" placeholder="path" value="source/page"/>
    <button id="fetchBtn" class="btn-small">取得</button>
    <button id="loadDemo" class="btn-small">デモ</button>
  </div>
</header>

<main>
  <section class="hero">
    <div class="left">
      <strong>説明</strong>
      <div class="muted" style="margin-top:6px">
        初期で <code>https://nemonowa.github.io/source/page</code> を読み込みます。カードクリックでページへリダイレクト。
      </div>
    </div>
    <div class="right" style="text-align:right">
      <div class="muted">件数: <span id="count">--</span></div>
      <div class="muted" style="margin-top:6px">最終更新: <span id="lastUpdated">--</span></div>
    </div>
  </section>

  <section>
    <div id="gridArea" class="content-grid" role="list"></div>
    <div id="listArea" class="list-view" role="list"></div>
    <div class="pagination">
      <button id="prevBtn" class="btn-small">前へ</button>
      <div class="muted" style="min-width:140px;text-align:center">
        ページ <span id="pageNum">1</span> / <span id="pageTotal">1</span>
      </div>
      <button id="nextBtn" class="btn-small">次へ</button>
    </div>
  </section>
</main>

<footer>© <span id="year"></span> NEXUS — Crafted by SoraFlete</footer>
<div id="imgModal" class="modal">
  <img id="modalImg" alt="preview image"/>
</div>

<script>
(function(){
document.getElementById("year").textContent=new Date().getFullYear();
const DEFAULT_OWNER="nemonowa",DEFAULT_REPO="nemonowa.github.io",DEFAULT_PATH="source/page";
const state={owner:DEFAULT_OWNER,repo:DEFAULT_REPO,path:DEFAULT_PATH,items:[],page:1,perPage:12};
const ownerEl=document.getElementById("owner"),repoEl=document.getElementById("repo"),pathEl=document.getElementById("path");
const fetchBtn=document.getElementById("fetchBtn"),loadDemoBtn=document.getElementById("loadDemo");
const gridArea=document.getElementById("gridArea"),listArea=document.getElementById("listArea");
const countEl=document.getElementById("count"),lastUpdatedEl=document.getElementById("lastUpdated");
const prevBtn=document.getElementById("prevBtn"),nextBtn=document.getElementById("nextBtn");
const pageNumEl=document.getElementById("pageNum"),pageTotalEl=document.getElementById("pageTotal");
const imgModal=document.getElementById("imgModal"),modalImg=document.getElementById("modalImg");

function extOf(name){return name.split(".").pop().toLowerCase();}
function openModal(src){modalImg.src=src;imgModal.style.display="flex";}
imgModal.addEventListener("click",()=>imgModal.style.display="none");

async function fetchDir(){
  const url=`https://api.github.com/repos/${state.owner}/${state.repo}/contents/${state.path}`;
  const res=await fetch(url);
  const data=await res.json();
  if(!Array.isArray(data)){ alert("Failed to fetch or invalid path"); return; }
  state.items=data.filter(f=>["html","htm","md"].includes(extOf(f.name)))
    .map(f=>({name:f.name,path:f.path,html_url:`https://${state.repo}/source/page/${f.name}`}));
  state.page=1; renderPage();
}

function renderPage(){
  const start=(state.page-1)*state.perPage,end=start+state.perPage;
  const pageItems=state.items.slice(start,end);
  countEl.textContent=state.items.length;
  lastUpdatedEl.textContent="--";
  pageNumEl.textContent=state.page;
  pageTotalEl.textContent=Math.ceil(state.items.length/state.perPage);

  gridArea.innerHTML=""; listArea.innerHTML="";
  pageItems.forEach(item=>{
    const card=document.createElement("div");
    card.className="card"; card.tabIndex=0; card.role="listitem";
    card.addEventListener("click",()=>window.location.href=item.html_url);
    card.innerHTML=`<div class="thumb"></div><div style="margin-top:6px"><strong>${item.name}</strong></div>
      <div class="meta"><span></span><span></span><span class="open-file">open file</span></div>`;
    gridArea.appendChild(card);

    const listItem=document.createElement("div");
    listItem.className="list-item"; listItem.textContent=item.name;
    listItem.addEventListener("click",()=>window.location.href=item.html_url);
    listArea.appendChild(listItem);
  });
}

prevBtn.addEventListener("click",()=>{if(state.page>1){state.page--;renderPage();}});
nextBtn.addEventListener("click",()=>{if(state.page<Math.ceil(state.items.length/state.perPage)){state.page++;renderPage();}});
fetchBtn.addEventListener("click",()=>{
  state.owner=ownerEl.value||DEFAULT_OWNER;
  state.repo=repoEl.value||DEFAULT_REPO;
  state.path=pathEl.value||DEFAULT_PATH;
  fetchDir();
});
loadDemoBtn.addEventListener("click",()=>fetchDir());

fetchDir();
})();
</script>
</body>
</html>
