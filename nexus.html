<!DOCTYPE html>
<html lang="ja" itemtype="http://schema.org/WebPage">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>NEXUS — Page Index (nemonowa default)</title>
    <meta name="theme-color" content="#1e28d2" />
    <link rel="icon" href="/icon.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-1: linear-gradient(180deg, #071028 0%, #0b1430 40%, #08122a 100%);
        --muted: rgba(230, 238, 246, 0.6);
        --card-bg: rgba(255, 255, 255, 0.02);
        --accent: #6ee7b7;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: "DM Mono", monospace;
        color: #e6eef6;
        background: var(--bg-1);
      }
      #nexus-root {
        max-width: 1200px;
        margin: auto;
        padding: 20px;
        box-sizing: border-box;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        padding: 12px;
        border-radius: 12px;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.02),
          transparent
        );
        border: 1px solid rgba(255, 255, 255, 0.03);
        box-shadow: 0 10px 30px rgba(2, 6, 23, 0.6);
        margin-bottom: 16px;
      }
      .brand {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .mark {
        width: 56px;
        height: 56px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: conic-gradient(
          from 200deg,
          rgba(124, 92, 255, 0.18),
          rgba(110, 231, 183, 0.06)
        );
      }
      .brand h1 {
        margin: 0;
        font-size: 1.1rem;
      }
      .lead {
        margin: 0;
        font-size: 0.85rem;
        color: var(--muted);
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .controls input[type="text"] {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.03);
        border-radius: 8px;
        padding: 8px 10px;
        color: inherit;
        outline: none;
        width: 200px;
      }
      .controls button {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 8px;
        padding: 8px 12px;
        color: inherit;
        cursor: pointer;
      }
      .hero {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 16px;
        margin: 16px 0;
        padding: 14px;
        border-radius: 12px;
        background: linear-gradient(180deg, var(--card-bg), transparent);
        border: 1px solid rgba(255, 255, 255, 0.03);
      }
      .left {
        max-width: 100%;
      }
      .right {
        text-align: right;
      }
      .content-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
        margin-top: 12px;
      }
      .card {
        padding: 12px;
        border-radius: 12px;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.01),
          transparent
        );
        border: 1px solid rgba(255, 255, 255, 0.03);
        min-height: 140px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        cursor: pointer;
        transition: transform 0.15s, box-shadow 0.15s;
      }
      .card:hover {
        transform: translateY(-6px);
        box-shadow: 0 18px 40px rgba(2, 6, 23, 0.6);
      }
      .thumb {
        width: 100%;
        aspect-ratio: 2/1;
        overflow: hidden;
        border-radius: 8px;
      }
      .thumb img {
        width: 100%;
        height: 100%;
        display: block; /* block のまま */
        object-fit: cover; /* 枠いっぱいに拡大・切り抜き */
        object-position: center center; /* 中央基準に変更 */
      }
      .meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        font-size: 0.85rem;
        color: var(--accent);
      }
      .muted {
        color: var(--muted);
      }

      /* タグ表示用 */
      .tags {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .tag {
        background: rgba(255, 255, 255, 0.03);
        color: var(--muted);
        padding: 4px 8px;
        border-radius: 999px;
        font-size: 0.75rem;
        line-height: 1;
        cursor: pointer; /* 追加：クリックできることを示す */
        user-select: none;
      }
      .tag.active {
        background: var(--accent);
        color: #001;
        font-weight: 700;
      }

      /* アクティブフィルタ表示 */
      #activeFilter {
        min-height: 28px;
      }
      #activeFilter .clear-btn {
        margin-left: 8px;
        padding: 6px 8px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.06);
        background: transparent;
        color: inherit;
        cursor: pointer;
        font-size: 0.75rem;
      }

      .pagination {
        display: flex;
        gap: 8px;
        justify-content: center;
        align-items: center;
        margin-top: 14px;
        flex-wrap: wrap;
      }
      .pagination button {
        padding: 8px 12px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.04);
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
      @media (max-width: 1100px) {
        .content-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 720px) {
        .content-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="nexus-root">
      <header>
        <div class="brand">
          <div class="mark"></div>
          <div>
            <h1>NEXUS — Page Index</h1>
            <p class="lead">
              `nemonowa.github.io/source/page` を初期で読み込みます —
              24件/ページ
            </p>
          </div>
        </div>
        <div class="controls">
          <input id="owner" type="text" placeholder="owner" value="nemonowa" />
          <input
            id="repo"
            type="text"
            placeholder="repo"
            value="nemonowa.github.io"
          />
          <input id="path" type="text" placeholder="path" value="source/page" />
          <button id="fetchBtn">取得</button>
          <button id="loadDemo">デモ</button>
        </div>
      </header>

      <section class="hero">
        <div class="left">
          <strong>説明</strong>
          <div class="muted" style="margin-top: 6px">
            初期で
            <code>https://nemonowa.github.io/source/page</code>
            を読み込みます。カードクリックでページへリダイレクト。
          </div>
        </div>
        <div class="right">
          <div class="muted">件数: <span id="count">--</span></div>
          <div class="muted" style="margin-top: 6px">
            最終更新: <span id="lastUpdated">--</span>
          </div>
        </div>
      </section>

      <!-- 追加：現在のフィルタ表示 -->
      <div id="activeFilter"></div>

      <main>
        <div id="gridArea" class="content-grid"></div>
        <div class="pagination">
          <button id="prevBtn">前へ</button>
          <div class="muted" style="min-width: 140px; text-align: center">
            ページ <span id="pageNum">1</span> / <span id="pageTotal">1</span>
          </div>
          <button id="nextBtn">次へ</button>
        </div>
      </main>
      <footer>© <span id="year"></span> NEXUS — Crafted by SoraFlete</footer>
      <div id="imgModal" class="modal" style="display: none">
        <img id="modalImg" alt="preview image" />
      </div>
    </div>
    <script>
      (function () {
        const DEFAULT_OWNER = "nemonowa",
          DEFAULT_REPO = "nemonowa.github.io",
          DEFAULT_PATH = "source/page";
        const state = {
          owner: DEFAULT_OWNER,
          repo: DEFAULT_REPO,
          path: DEFAULT_PATH,
          items: [],
          page: 1,
          perPage: 24,
          activeTag: null, // 追加：現在のタグフィルタ
        };
        const ownerEl = document.getElementById("owner"),
          repoEl = document.getElementById("repo"),
          pathEl = document.getElementById("path");
        const fetchBtn = document.getElementById("fetchBtn"),
          loadDemoBtn = document.getElementById("loadDemo");
        const gridArea = document.getElementById("gridArea"),
          countEl = document.getElementById("count"),
          lastUpdatedEl = document.getElementById("lastUpdated");
        const prevBtn = document.getElementById("prevBtn"),
          nextBtn = document.getElementById("nextBtn");
        const pageNumEl = document.getElementById("pageNum"),
          pageTotalEl = document.getElementById("pageTotal");
        const imgModal = document.getElementById("imgModal"),
          modalImg = document.getElementById("modalImg");
        const activeFilterEl = document.getElementById("activeFilter"); // 追加：表示領域
        document.getElementById("year").textContent = new Date().getFullYear();

        function extOf(name) {
          return (name.split(".").pop() || "").toLowerCase();
        }
        function basename(name) {
          return name.replace(/\.[^/.]+$/, "");
        }

        /* ファイル名から【...】を抽出して配列で返す関数 */
        function extractTagsFromName(name) {
          const base = basename(name);
          const tags = [];
          const re = /【([^】]+)】/g;
          let m;
          while ((m = re.exec(base)) !== null) {
            tags.push(m[1]);
          }
          return tags;
        }

        /* タイトル表示用に【...】部分を取り除いた文字列を返す関数 */
        function stripTagsFromBasename(name) {
          return basename(name)
            .replace(/【[^】]+】/g, "")
            .trim();
        }

        function render() {
          const items = state.items;

          // --- フィルタ適用 ---
          const filtered = state.activeTag
            ? items.filter((it) => {
                const tags = extractTagsFromName(it.name);
                return tags.includes(state.activeTag);
              })
            : items;

          countEl.textContent = filtered.length;

          const totalPages = Math.max(
            1,
            Math.ceil(filtered.length / state.perPage)
          );
          pageTotalEl.textContent = totalPages;
          pageNumEl.textContent = state.page;

          if (filtered.length > 0) {
            const latest = filtered
              .slice()
              .sort(
                (a, b) =>
                  new Date(b.updated_at || 0) - new Date(a.updated_at || 0)
              )[0];
            lastUpdatedEl.textContent = latest.updated_at
              ? new Date(latest.updated_at).toLocaleString()
              : "--";
          } else lastUpdatedEl.textContent = "--";

          const start = (state.page - 1) * state.perPage;
          const pageItems = filtered.slice(start, start + state.perPage);

          // アクティブフィルタの表示更新
          if (state.activeTag) {
            activeFilterEl.innerHTML =
              'フィルタ: <span class="tag active">' +
              state.activeTag +
              '</span><button class="clear-btn" id="clearFilter">クリア</button>';
            const clearBtn = document.getElementById("clearFilter");
            if (clearBtn) {
              clearBtn.addEventListener("click", (e) => {
                e.preventDefault();
                state.activeTag = null;
                state.page = 1;
                render();
              });
            }
          } else {
            activeFilterEl.innerHTML = ""; // フィルタ無ければ非表示
          }

          gridArea.innerHTML = "";
          pageItems.forEach((it) => {
            const a = document.createElement("a");
            a.href = `https://${state.repo.replace(/\/$/, "")}/${encodeURI(
              it.path
            )}`;
            a.style.textDecoration = "none";
            a.style.color = "inherit";

            const card = document.createElement("article");
            card.className = "card";

            const thumb = document.createElement("div");
            thumb.className = "thumb";
            if (it.image) {
              const img = document.createElement("img");
              img.src = it.image;
              img.alt = basename(it.name);
              thumb.appendChild(img);
            } else
              thumb.innerHTML =
                '<div style="padding:8px;color:var(--muted);font-size:0.9rem">No image</div>';

            const title = document.createElement("div");
            title.innerHTML =
              '<strong style="display:block;margin:6px 0;font-size:1rem">' +
              stripTagsFromBasename(it.name) +
              '</strong><div class="muted" style="font-size:0.9rem;min-height:36px">' +
              (it.desc || "") +
              "</div>";

            const metaRow = document.createElement("div");
            metaRow.className = "meta";

            // 左側：タグ表示（クリックでフィルタ）
            const left = document.createElement("div");
            const tags = extractTagsFromName(it.name);
            if (tags.length > 0) {
              const tagsWrap = document.createElement("div");
              tagsWrap.className = "tags";
              tags.forEach((t) => {
                const span = document.createElement("span");
                span.className =
                  "tag" + (state.activeTag === t ? " active" : "");
                span.textContent = t;
                // タグクリックでフィルタ（アンカー遷移を防ぐ）
                span.addEventListener("click", (e) => {
                  e.preventDefault();
                  e.stopPropagation();
                  if (state.activeTag === t) {
                    state.activeTag = null; // 再クリックで解除
                  } else {
                    state.activeTag = t;
                  }
                  state.page = 1;
                  render();
                });
                tagsWrap.appendChild(span);
              });
              left.appendChild(tagsWrap);
            } else {
              left.textContent = "";
            }

            const right = document.createElement("div");
            right.textContent = it.updated_at
              ? new Date(it.updated_at).toLocaleDateString()
              : "--";
            metaRow.appendChild(left);
            metaRow.appendChild(right);

            card.appendChild(thumb);
            card.appendChild(title);
            card.appendChild(metaRow);

            a.appendChild(card);
            gridArea.appendChild(a);
          });
          prevBtn.disabled = state.page <= 1;
          nextBtn.disabled =
            state.page >= totalPages || state.items.length === 0;
        }

        async function fetchFromGitHub(owner, repo, path) {
          const apiBase = "https://api.github.com";
          try {
            const url = `${apiBase}/repos/${owner}/${repo}/contents/${encodeURIComponent(
              path
            )}`;
            const res = await fetch(url);
            if (!res.ok)
              throw new Error("Contents fetch failed: " + res.status);
            const contents = await res.json();
            const files = Array.isArray(contents) ? contents : [];
            const imageExts = ["png", "jpg", "jpeg", "webp", "gif", "svg"];
            const images = {};
            files.forEach((f) => {
              const e = extOf(f.name);
              if (imageExts.includes(e))
                images[basename(f.name)] =
                  f.download_url || f.html_url || f.url;
            });
            const htmlFiles = files.filter((f) =>
              ["html", "htm", "md"].includes(extOf(f.name))
            );
            const items = [];
            htmlFiles.forEach((f) => {
              const it = {
                name: f.name,
                path: f.path,
                html_url: f.html_url || f.download_url || "",
                download_url: f.download_url || "",
                desc: "",
                author: "",
                updated_at: "",
                image: null,
              };
              const base = basename(f.name);
              if (images[base]) it.image = images[base];
              if (!it.image) {
                for (const [k, v] of Object.entries(images)) {
                  if (k.startsWith(base) || base.startsWith(k)) {
                    it.image = v;
                    break;
                  }
                }
              }
              items.push(it);
            });
            // まとめて最新コミットを取得（1回のリクエスト）
            const commitsUrl = `${apiBase}/repos/${owner}/${repo}/commits?path=${encodeURIComponent(
              path
            )}&per_page=100`;
            const commitRes = await fetch(commitsUrl);
            if (commitRes.ok) {
              const commits = await commitRes.json();
              items.forEach((it) => {
                const commit = commits.find(
                  (c) =>
                    c.commit &&
                    c.commit.author &&
                    c.commit.author.date &&
                    c.html_url &&
                    c.commit.message &&
                    c.commit.message.includes(it.name)
                );
                if (commit) {
                  it.updated_at = commit.commit.author.date;
                  it.author = commit.commit.author.name;
                }
              });
            }
            return items;
          } catch (e) {
            console.error(e);
            return [];
          }
        }

        fetchBtn.addEventListener("click", async () => {
          state.owner = ownerEl.value;
          state.repo = repoEl.value;
          state.path = pathEl.value;
          state.page = 1;
          state.items = await fetchFromGitHub(
            state.owner,
            state.repo,
            state.path
          );
          render();
        });
        loadDemoBtn.addEventListener("click", async () => {
          state.page = 1;
          state.items = await fetchFromGitHub(
            DEFAULT_OWNER,
            DEFAULT_REPO,
            DEFAULT_PATH
          );
          render();
        });
        prevBtn.addEventListener("click", () => {
          if (state.page > 1) {
            state.page--;
            render();
          }
        });
        nextBtn.addEventListener("click", () => {
          const totalPages = Math.max(
            1,
            Math.ceil(state.items.length / state.perPage)
          );
          if (state.page < totalPages) {
            state.page++;
            render();
          }
        });
        imgModal.addEventListener("click", () => {
          imgModal.style.display = "none";
          modalImg.src = "";
        });
        // 初期読み込み
        (async () => {
          state.items = await fetchFromGitHub(
            DEFAULT_OWNER,
            DEFAULT_REPO,
            DEFAULT_PATH
          );
          render();
        })();
      })();
    </script>
  </body>
</html>
