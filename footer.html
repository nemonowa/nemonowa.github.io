<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXUS Footer</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <style>
      /* 全体リセット */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Segoe UI", "Yu Gothic", sans-serif;
        background: transparent;
      }

      footer {
        width: 100%;
        background: rgba(0, 0, 0, 0.65);
        backdrop-filter: blur(8px);
        color: #f0f8ff;
        text-align: center;
        padding: 3vh 2vw;
        border-top: 1px solid rgba(255, 255, 255, 0.2);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
      }

      .icon-grfft_logo {
        font-size: 2rem;
        font-weight: bold;
        text-shadow: 0 0 6px rgba(255, 255, 255, 0.7);
        /* ここにSVGや画像ロゴを挿入可能 */
      }

      .social-icons {
        display: flex;
        gap: 1.5rem;
      }

      .social-icon {
        color: #f0f8ff;
        transition: transform 0.2s, color 0.2s;
      }

      .social-icon:hover {
        transform: scale(1.2);
        color: #ffd700;
      }

      .copyrights {
        font-size: 0.9rem;
        color: var(--muted, #a0b0c0);
        margin-top: 0.5rem;
      }

      @media (max-width: 600px) {
        .icon-grfft_logo {
          font-size: 1.5rem;
        }
        .social-icons {
          gap: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <footer>
      <div class="icon-grfft_logo">✯ NEXUS ✯</div>
      <div class="social-icons">
        <a
          href="https://twitter.com/yourusername"
          target="_blank"
          class="social-icon"
        >
          <i class="fab fa-twitter fa-2x"></i>
        </a>
        <a
          href="https://discord.com/invite/yourinvitecode"
          target="_blank"
          class="social-icon"
        >
          <i class="fab fa-discord fa-2x"></i>
        </a>
        <a
          href="https://www.youtube.com/channel/yourchannel"
          target="_blank"
          class="social-icon"
        >
          <i class="fab fa-youtube fa-2x"></i>
        </a>
      </div>
      <div class="copyrights">
        Copyright © 2010-2027 SoraFlete. All Rights Reserved.
      </div>
    </footer>
  </body>
</html>
