<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXUS Footer + UI</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <style>
      /* 全体リセット */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Segoe UI", "Yu Gothic", sans-serif;
        background: transparent;
      }

      /* フッター */
      footer {
        width: 100%;
        height: 15vh;
        background: rgba(0, 0, 0, 0.65);
        backdrop-filter: blur(8px);
        color: #f0f8ff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        position: relative;
      }

      .icon-grfft_logo {
        font-size: 2rem;
        font-weight: bold;
        text-shadow: 0 0 6px rgba(255, 255, 255, 0.7);
      }
      .social-icons {
        display: flex;
        gap: 1.5rem;
        margin: 0.5rem 0;
      }
      .social-icon {
        color: #f0f8ff;
        transition: transform 0.2s, color 0.2s;
      }
      .social-icon:hover {
        transform: scale(1.2);
        color: #ffd700;
      }
      .copyrights {
        font-size: 0.9rem;
        color: var(--muted, #a0b0c0);
      }

      /* UIボタン */
      .button {
        position: fixed;
        width: 15vh;
        height: 15vh;
        background-color: rgba(0, 0, 0, 0.25);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        color: #fff;
        cursor: pointer;
        z-index: 10;
        transition: opacity 0.2s;
      }
      .button:hover {
        opacity: 0.5;
      }
      .top_left {
        top: 0;
        left: 0;
        clip-path: polygon(0 0, 100% 0, 0 100%);
      }
      .top_right {
        top: 0;
        right: 0;
        clip-path: polygon(100% 0, 100% 100%, 0 0);
      }
      .bottom_left {
        bottom: 0;
        left: 0;
        clip-path: polygon(0 100%, 100% 100%, 0 0);
      }
      .bottom_right {
        bottom: 0;
        right: 0;
        clip-path: polygon(100% 100%, 0 100%, 100% 0);
      }

      /* メニュー */
      .menu {
        display: none;
        position: fixed;
        background: rgba(0, 0, 0, 0.8);
        color: #fff;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
        z-index: 5;
        font-size: 1rem;
      }

      #menu1 {
        top: 20%;
        left: 10%;
        right: 10%;
      }
      #menu2 {
        top: 20%;
        left: 10%;
        right: 10%;
      }
      #menu3 {
        top: 20%;
        left: 10%;
        right: 10%;
      }
      #menu4 {
        top: 20%;
        left: 10%;
        right: 10%;
      }

      @media (max-width: 600px) {
        .icon-grfft_logo {
          font-size: 1.5rem;
        }
        .social-icons {
          gap: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <footer>
      <div class="icon-grfft_logo">✯ NEXUS ✯</div>
      <div class="social-icons">
        <a
          href="https://twitter.com/yourusername"
          target="_blank"
          class="social-icon"
        >
          <i class="fab fa-twitter fa-2x"></i>
        </a>
        <a
          href="https://discord.com/invite/yourinvitecode"
          target="_blank"
          class="social-icon"
        >
          <i class="fab fa-discord fa-2x"></i>
        </a>
        <a
          href="https://www.youtube.com/channel/yourchannel"
          target="_blank"
          class="social-icon"
        >
          <i class="fab fa-youtube fa-2x"></i>
        </a>
      </div>
      <div class="copyrights">
        Copyright © 2010-2027 SoraFlete. All Rights Reserved.
      </div>

      <!-- UIボタン -->
      <div class="button top_left" onclick="toggleMenu('menu1')">⚓</div>
      <div class="button bottom_left" onclick="toggleMenu('menu2')">🔗</div>
      <div class="button top_right" onclick="toggleMenu('menu3')">🔍</div>
      <div class="button bottom_right" onclick="toggleMenu('menu4')">🎖️</div>

      <!-- メニュー -->
      <div class="menu" id="menu1">
        <p>1st-Tab FastTravel</p>
        <a href="https://nemonowa.github.io/">⌖ Link to NEXUS</a><br />
        <a href="https://nemonowa.github.io/nexus">⌖ Link to HOMEBASE</a><br />
        <a href="https://nemonowa.github.io/404">⌖ Link to 404</a><br />
      </div>
      <div class="menu" id="menu2">
        <p>2nd-Tab CreateLink＆Tools</p>
        <a href="https://nemonowa.github.io/login.html">⌖ Login</a><br />
        <a href="https://nemonowa.github.io/nexus.html">⌖ About</a><br />
        <a href="https://nemonowa.github.io/login.html">⌖ Contact</a><br />
      </div>
      <div class="menu" id="menu3">
        <p>3rd-Tab AccountSettings</p>
        <br />
        <a href="https://nemonowa.github.io/login.html">⌖ Login</a><br />
        <a href="https://nemonowa.github.io/source/teleport.html">⌖ search</a
        ><br />
        <a href="https://nemonowa.github.io/source/teleport.html">⌖ teleport</a
        ><br />
      </div>
      <div class="menu" id="menu4">
        <p>4th-Tab Scoreboard</p>
        <a href="https://nemonowa.github.io/">⌖ Home</a><br />
        <a href="https://nemonowa.github.io/nexus.html">⌖ About</a><br />
        <a href="https://nemonowa.github.io/login.html">⌖ Contact</a><br />
      </div>
    </footer>

    <script>
      function toggleMenu(menuId) {
        const menus = document.querySelectorAll(".menu");
        menus.forEach((menu) => {
          if (menu.id === menuId) {
            menu.style.display =
              menu.style.display === "block" ? "none" : "block";
          } else {
            menu.style.display = "none";
          }
        });
      }
    </script>
  </body>
</html>
