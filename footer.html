<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXUS Footer + UI</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <style>
      body {
        font-family: "Segoe UI", "Yu Gothic", sans-serif;
        background: transparent;
      }

      /* フッター */
      footer {
        width: 100%;
        height: 15vh; /* 画面高さの15% */
        background: rgba(0, 0, 0, 0.65);
        backdrop-filter: blur(8px);
        color: #f0f8ff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        position: relative;
      }

      .icon-grfft_logo {
        font-size: 2rem;
        font-weight: bold;
        text-shadow: 0 0 6px rgba(255, 255, 255, 0.7);
      }

      .social-icons {
        display: flex;
        gap: 1.5rem;
        margin: 0.5rem 0;
      }

      .social-icon {
        color: #f0f8ff;
        transition: transform 0.2s, color 0.2s;
      }

      .social-icon:hover {
        transform: scale(1.2);
        color: #ffd700;
      }

      .copyrights {
        font-size: 0.9rem;
        color: var(--muted, #a0b0c0);
      }

      /* UIボタンを footer 内で四隅配置 */
      .button {
        position: absolute;
        width: 3rem;
        height: 3rem;
        background-color: rgba(0, 0, 0, 0.25);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        color: #fff;
        cursor: pointer;
        transition: opacity 0.2s;
      }
      .button:hover {
        opacity: 0.5;
      }
      .top_left {
        top: 0.5rem;
        left: 0.5rem;
      }
      .top_right {
        top: 0.5rem;
        right: 0.5rem;
      }
      .bottom_left {
        bottom: 0.5rem;
        left: 0.5rem;
      }
      .bottom_right {
        bottom: 0.5rem;
        right: 0.5rem;
      }

      /* メニュー */
      .menu {
        display: none;
        position: fixed;
        background: rgba(0, 0, 0, 0.8);
        color: #fff;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
        z-index: 5;
        font-size: 1rem;
        top: 20%;
        left: 10%;
        right: 10%;
      }

      @media (max-width: 600px) {
        .icon-grfft_logo {
          font-size: 1.5rem;
        }
        .social-icons {
          gap: 1rem;
        }
        .button {
          width: 2.5rem;
          height: 2.5rem;
          font-size: 1.2rem;
        }
      }
    </style>
  </head>
  <body>
    <footer>
      <div class="icon-grfft_logo">✯ NEXUS ✯</div>
      <div class="social-icons">
        <a
          href="https://twitter.com/yourusername"
          target="_blank"
          class="social-icon"
        >
          <i class="fab fa-twitter fa-2x"></i>
        </a>
        <a
          href="https://discord.com/invite/yourinvitecode"
          target="_blank"
          class="social-icon"
        >
          <i class="fab fa-discord fa-2x"></i>
        </a>
        <a
          href="https://www.youtube.com/channel/yourchannel"
          target="_blank"
          class="social-icon"
        >
          <i class="fab fa-youtube fa-2x"></i>
        </a>
      </div>

      <div class="copyrights">
        Copyright © 2010-2027 SoraFlete. All Rights Reserved.
      </div>
    </footer>
  </body>
</html>
