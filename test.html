<!DOCTYPE html>
<html lang="ja" itemtype="http://schema.org/WebPage">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e28d2" />
    <link rel="icon" href="/icon.png" />
    <meta property="og:image" content="/icon.png" />
    <meta property="og:title" content="NEXUS異空旅団｜逓信観測局" />
    <meta
      property="og:description"
      content="The Official Web-Site for Project✯NEXUS. Copyright © SoraFlete. All Rights Reserved."
    />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <!-- 共通CSS/JSをルート直下参照に変更 -->
    <link rel="stylesheet" href="/styles.css" />
    <script src="/scripts.js" defer></script>

    <title>𝑪𝒂𝒕𝒄𝒉 𝒎𝒆 𝒊𝒇 𝒚𝒐𝒖 𝒄𝒂𝒏</title>

    <style>
      /* =========== NAMESPACE: #nexus-root =========== */
      /* これにより外部CSSの汎用セレクタと衝突しにくくします */
      #nexus-root * {
        box-sizing: border-box;
      }

      #nexus-root {
        --card: rgba(255, 255, 255, 0.03);
        --muted: rgba(255, 255, 255, 0.6);
        --accent: #6ee7b7;
        font-family: "DM Mono", monospace !important;
        color: #e6eef6;
        width: 100%;
        min-height: 100vh;
        padding: 36px 18px;
        background: var(--bg-1);
      }

      /* 全体ラップ */
      #nexus-root .wrap {
        max-width: 1150px;
        margin: 0 auto;
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: 18px;
      }

      /* header/main/footer はスコープして上書き */
      #nexus-root .panel {
        padding: 18px;
        border-radius: 14px;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.02),
          rgba(255, 255, 255, 0.01)
        );
        border: 1px solid rgba(255, 255, 255, 0.03);
        box-shadow: 0 10px 30px rgba(2, 6, 23, 0.45);
      }

      /* card grid & list, scoped */
      #nexus-root .content-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
        margin-top: 14px;
      }
      #nexus-root .card {
        padding: 14px;
        border-radius: 12px;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.01),
          transparent
        );
        border: 1px solid rgba(255, 255, 255, 0.03);
        min-height: 110px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        transition: transform 0.18s, box-shadow 0.18s;
        cursor: pointer;
      }
      #nexus-root .card:hover {
        transform: translateY(-6px);
        box-shadow: 0 18px 40px rgba(2, 6, 23, 0.6);
      }

      #nexus-root .list-view {
        margin-top: 14px;
      }
      #nexus-root .list-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.01);
        border: 1px solid rgba(255, 255, 255, 0.02);
        margin-bottom: 8px;
      }

      /* grid overlay: 初期から表示 */
      #nexus-root .grid-overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 999;
        opacity: 1;
      }
      #nexus-root .grid-overlay::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: linear-gradient(
            rgba(255, 255, 255, 0.02) 1px,
            transparent 1px
          ),
          linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        background-size: 48px 48px;
        mix-blend-mode: overlay;
      }

      @media (max-width: 980px) {
        #nexus-root .content-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 640px) {
        #nexus-root .content-grid {
          grid-template-columns: 1fr;
        }
      }

      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
      }
    </style>
  </head>

  <body>
    <div id="nexus-root" role="main" aria-labelledby="page-title">
      <div class="wrap">
        <!-- header -->
        <div id="header-container"></div>

        <main>
          <section class="panel hero" aria-labelledby="summary-title">
            <div class="hero-left">
              <h2 id="summary-title">最新のリンク一覧</h2>
              <p
                style="margin: 6px 0 0 0; color: var(--muted); font-size: 13px"
              >
                ここにはサイト内の重要リンクや外部リソースを一覧で表示します。
              </p>
              <div
                style="
                  margin-top: 10px;
                  display: flex;
                  gap: 8px;
                  flex-wrap: wrap;
                "
              >
                <input
                  id="owner"
                  placeholder="owner (例: nemonowa)"
                  style="
                    padding: 8px;
                    border-radius: 8px;
                    border: 1px solid rgba(255, 255, 255, 0.03);
                    background: transparent;
                    color: inherit;
                  "
                />
                <input
                  id="repo"
                  placeholder="repo (例: nemonowa.github.io)"
                  style="
                    padding: 8px;
                    border-radius: 8px;
                    border: 1px solid rgba(255, 255, 255, 0.03);
                    background: transparent;
                    color: inherit;
                  "
                />
                <button class="btn" id="ghFetch">履歴取得</button>
                <button class="btn" id="importDemo">デモ読み込み</button>
              </div>
            </div>
            <div style="min-width: 260px; text-align: right">
              <div class="panel" style="padding: 12px; border-radius: 12px">
                <div style="font-size: 12px; color: var(--muted)">表示数</div>
                <div style="font-size: 20px; font-weight: 800" id="count">
                  --
                </div>
                <div
                  style="margin-top: 8px; font-size: 12px; color: var(--muted)"
                >
                  最終更新: <span id="lastUpdated">--</span>
                </div>
              </div>
            </div>
          </section>

          <section class="panel" aria-label="リンク一覧">
            <div
              style="
                display: flex;
                gap: 10px;
                align-items: center;
                flex-wrap: wrap;
                margin-bottom: 12px;
              "
            >
              <label style="color: var(--muted)">ソート：</label>
              <select
                id="sortSelect"
                style="
                  padding: 6px;
                  border-radius: 8px;
                  background: transparent;
                  border: 1px solid rgba(255, 255, 255, 0.03);
                  color: inherit;
                "
              >
                <option value="name">名前順 (昇)</option>
                <option value="date_desc">更新日 (新→古)</option>
                <option value="date_asc">更新日 (古→新)</option>
              </select>
              <label style="color: var(--muted)">フィルタ：</label>
              <input
                id="searchFilter"
                placeholder="名前でフィルタ..."
                style="
                  padding: 6px;
                  border-radius: 6px;
                  border: 1px solid rgba(255, 255, 255, 0.03);
                  background: transparent;
                  color: inherit;
                "
              />
            </div>
            <div class="content-grid" id="linkGrid"></div>
            <div class="list-view" id="linkList"></div>
          </section>
        </main>

        <!-- footer -->
        <div id="footer-container"></div>
        <div id="ui"></div>
      </div>

      <!-- grid overlay -->
      <div class="grid-overlay"></div>
    </div>

    <script>
      // 共通header/footerをルート直下HTMLから読み込む
      async function loadHTML(id, path) {
        try {
          const res = await fetch(path);
          if (res.ok) {
            document.getElementById(id).innerHTML = await res.text();
          } else {
            console.error(path + " の読み込みに失敗しました");
          }
        } catch (e) {
          console.error("fetch error: ", e);
        }
      }

      loadHTML("header-container", "/header.html");
      loadHTML("footer-container", "/footer.html");
    </script>
  </body>
</html>
