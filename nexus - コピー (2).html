<!DOCTYPE html>
<html lang="ja" itemtype="http://schema.org/WebPage">
  <head>
    <!-- 外部から読み込み -->
    <title>𝑪𝒂𝒕𝒄𝒉 𝒎𝒆 𝒊𝒇 𝒚𝒐𝒖 𝒄𝒂𝒏</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e28d2" />
    <link rel="icon" href="https://nemonowa.github.io/icon.png" />
    <meta property="og:image" content="https://nemonowa.github.io/icon.png" />
    <meta property="og:title" content="NEXUS異空旅団｜逓信観測局" />
    <meta
      property="og:description"
      content="The Official Web-Site for Project✯NEXUS. Copyright © SoraFlete. All Rights Reserved."
    />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://nemonowa.github.io/styles.css" />
    <script src="https://nemonowa.github.io/scripts.js"></script>
  </head>
  <body>
    <header id="header"></header>
    <main id="main-content">
      <!-- 固定記事スライダー -->
      <section id="featured-posts">
        <h2>固定記事</h2>
        <div class="slider">
          <div class="slides"></div>
        </div>
      </section>

      <!-- 最新記事 -->
      <section id="latest-posts">
        <h2>最新記事</h2>
        <ul class="latest-list"></ul>
      </section>

      <!-- タグ一覧 -->
      <section id="tags">
        <h2>タグ一覧</h2>
        <div class="tag-list"></div>
      </section>

      <style>
        /* ===== 固定記事スライダー ===== */
        #featured-posts {
          margin-bottom: 5vh;
        }
        #featured-posts h2 {
          margin-bottom: 1vh;
        }
        .slider {
          overflow: hidden;
          position: relative;
          width: 100%;
          height: 25vh;
        }
        .slides {
          display: flex;
          gap: 1rem;
          transition: transform 0.5s ease-in-out;
        }
        .slide {
          min-width: 80%;
          background: rgba(255, 255, 255, 0.05);
          padding: 1rem;
          border-radius: 10px;
          box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
          flex-shrink: 0;
        }

        /* ===== 最新記事 ===== */
        #latest-posts {
          margin-bottom: 5vh;
        }
        .latest-list {
          list-style: none;
          display: flex;
          flex-direction: column;
          gap: 1rem;
        }
        .latest-list li {
          background: rgba(255, 255, 255, 0.05);
          padding: 0.8rem 1rem;
          border-radius: 8px;
        }

        /* ===== タグ一覧 ===== */
        #tags .tag-list {
          display: flex;
          flex-wrap: wrap;
          gap: 0.5rem;
        }
        .tag-list button {
          background: rgba(255, 255, 255, 0.05);
          border: none;
          padding: 0.5rem 1rem;
          border-radius: 6px;
          cursor: pointer;
          transition: background 0.2s;
        }
        .tag-list button:hover {
          background: rgba(255, 255, 255, 0.1);
        }
      </style>

      <script>
        document.addEventListener("DOMContentLoaded", () => {
          // --- 固定記事スライダー ---
          const featuredPosts = [
            "固定記事1：世界人権宣言の概要",
            "固定記事2：国際連合の取り組み",
            "固定記事3：自由と平等の価値",
            "固定記事4：平和維持活動の実例",
            "固定記事5：歴史的背景の解説",
          ];
          const slidesContainer = document.querySelector(".slides");
          featuredPosts.forEach((post) => {
            const div = document.createElement("div");
            div.className = "slide";
            div.textContent = post;
            slidesContainer.appendChild(div);
          });

          let slideIndex = 0;
          setInterval(() => {
            slideIndex = (slideIndex + 1) % featuredPosts.length;
            slidesContainer.style.transform = `translateX(-${
              slideIndex * 80
            }%)`;
          }, 3000);

          // --- 最新記事 ---
          const latestPosts = [
            "最新記事1：ニュース速報",
            "最新記事2：技術記事更新",
            "最新記事3：イベント情報",
            "最新記事4：おすすめリソース",
            "最新記事5：アップデート情報",
          ];
          const latestList = document.querySelector(".latest-list");
          latestPosts.forEach((post) => {
            const li = document.createElement("li");
            li.textContent = post;
            latestList.appendChild(li);
          });

          // --- タグ一覧 ---
          const tags = ["国際法", "平和", "人権", "歴史", "教育", "社会"];
          const tagList = document.querySelector(".tag-list");
          tags.forEach((tag) => {
            const btn = document.createElement("button");
            btn.textContent = tag;
            tagList.appendChild(btn);
          });
        });
      </script>
    </main>

    <footer id="footer"></footer>
    <div id="ui"></div>
  </body>
</html>
