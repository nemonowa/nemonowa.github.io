<!DOCTYPE html>
<html lang="ja" itemtype="http://schema.org/WebPage">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>NEXUS — Page Index (nemonowa default)</title>
    <meta name="theme-color" content="#1e28d2" />
    <link rel="icon" href="/icon.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-1: linear-gradient(180deg, #071028 0%, #0b1430 40%, #08122a 100%);
        --muted: rgba(230, 238, 246, 0.6);
        --card-bg: rgba(255, 255, 255, 0.02);
        --accent: #6ee7b7;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg-1);
        font-family: "DM Mono", monospace;
        color: #e6eef6;
      }
      #nexus-root {
        max-width: 1200px;
        margin: 28px auto;
        padding: 20px;
        box-sizing: border-box;
      }
      #nexus-root header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px;
        border-radius: 12px;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.02),
          transparent
        );
        border: 1px solid rgba(255, 255, 255, 0.03);
        box-shadow: 0 10px 30px rgba(2, 6, 23, 0.6);
      }
      #nexus-root .brand {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      #nexus-root .brand .mark {
        width: 56px;
        height: 56px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: conic-gradient(
          from 200deg,
          rgba(124, 92, 255, 0.18),
          rgba(110, 231, 183, 0.06)
        );
      }
      #nexus-root h1 {
        font-size: 1.1rem;
        margin: 0;
      }
      #nexus-root p.lead {
        margin: 0;
        color: var(--muted);
        font-size: 0.85rem;
      }
      #nexus-root .controls {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      #nexus-root .controls input[type="text"] {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.03);
        padding: 8px 10px;
        border-radius: 8px;
        color: inherit;
        outline: none;
        width: 200px;
      }
      #nexus-root .controls button {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.06);
        padding: 8px 12px;
        border-radius: 8px;
        color: inherit;
        cursor: pointer;
      }
      #nexus-root .hero {
        display: flex;
        gap: 16px;
        align-items: center;
        justify-content: space-between;
        margin: 16px 0;
        padding: 14px;
        border-radius: 12px;
        background: linear-gradient(180deg, var(--card-bg), transparent);
        border: 1px solid rgba(255, 255, 255, 0.03);
      }
      #nexus-root .content-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
        margin-top: 12px;
      }
      #nexus-root .card {
        padding: 12px;
        border-radius: 12px;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.01),
          transparent
        );
        border: 1px solid rgba(255, 255, 255, 0.03);
        min-height: 140px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        cursor: pointer;
        transition: transform 0.15s, box-shadow 0.15s;
      }
      #nexus-root .card:hover {
        transform: translateY(-6px);
        box-shadow: 0 18px 40px rgba(2, 6, 23, 0.6);
      }
      #nexus-root .thumb {
        width: 100%; /* 枠の幅は親に合わせる */
        aspect-ratio: 2 / 1; /* 横2:縦1 */
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.02);
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      #nexus-root .thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover; /* 枠いっぱいに画像をトリミング */
      }

      #nexus-root .meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 0.85rem;
      }
      #nexus-root .list-view {
        display: none;
        flex-direction: column;
        gap: 8px;
      }
      #nexus-root .list-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.01);
        border: 1px solid rgba(255, 255, 255, 0.02);
      }
      #nexus-root .pagination {
        display: flex;
        gap: 8px;
        align-items: center;
        justify-content: center;
        margin-top: 14px;
      }
      #nexus-root .pagination button {
        padding: 8px 12px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.04);
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
      #nexus-root .modal {
        position: fixed;
        inset: 0;
        background: rgba(2, 6, 23, 0.7);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1200;
      }
      #nexus-root .modal img {
        max-width: 90%;
        max-height: 85%;
        border-radius: 10px;
        box-shadow: 0 20px 60px rgba(2, 6, 23, 0.8);
      }
      footer {
        margin-top: 18px;
        padding: 12px;
        border-radius: 10px;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.01),
          transparent
        );
        border: 1px solid rgba(255, 255, 255, 0.03);
        text-align: center;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .muted {
        color: var(--muted);
      }
      .btn-small {
        padding: 6px 8px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.04);
        background: transparent;
        color: inherit;
        font-size: 0.85rem;
        cursor: pointer;
      }
      @media (max-width: 1100px) {
        #nexus-root .content-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 720px) {
        #nexus-root .content-grid {
          grid-template-columns: 1fr;
        }
        #nexus-root .hero .left {
          max-width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="nexus-root" role="main" aria-labelledby="page-title">
      <header role="banner" class="panel">
        <div class="brand">
          <div class="mark" id="logo" title="NEXUS" aria-hidden="true">
            <svg
              width="36"
              height="36"
              viewBox="0 0 24 24"
              fill="none"
              aria-hidden="true"
            >
              <circle
                cx="12"
                cy="12"
                r="9"
                stroke="white"
                stroke-opacity="0.06"
                stroke-width="1.6"
              ></circle>
              <path
                d="M9 15l6-3-6-3 1 3-1 3z"
                fill="white"
                opacity="0.85"
              ></path>
            </svg>
          </div>
          <div>
            <h1 id="page-title">NEXUS — Page Index</h1>
            <p class="lead">
              `nemonowa.github.io/source/page` を初期で読み込みます —
              10件/ページ
            </p>
          </div>
        </div>

        <div class="controls" role="navigation" aria-label="controls">
          <input
            id="owner"
            type="text"
            placeholder="owner (例: nemonowa)"
            value="nemonowa"
          />
          <input
            id="repo"
            type="text"
            placeholder="repo (例: nemonowa.github.io)"
            value="nemonowa.github.io"
          />
          <input
            id="path"
            type="text"
            placeholder="path (例: source/page)"
            value="source/page"
          />
          <button id="fetchBtn" class="btn-small" title="Fetch from GitHub">
            取得
          </button>
          <button id="loadDemo" class="btn-small">デモ</button>
        </div>
      </header>

      <main>
        <section class="hero panel" aria-label="summary">
          <div class="left">
            <strong>説明</strong>
            <div class="muted" style="margin-top: 6px">
              初期で <code>https://nemonowa.github.io/source/page</code>（GitHub
              Pages
              上）を読み込みます。カードクリックでそのページへリダイレクトします。カード内の
              <em>Open file</em> は GitHub
              のファイルページを新しいタブで開きます。
            </div>
          </div>
          <div class="right" style="text-align: right">
            <div class="muted">件数: <span id="count">--</span></div>
            <div class="muted" style="margin-top: 6px">
              最終更新: <span id="lastUpdated">--</span>
            </div>
          </div>
        </section>

        <section aria-label="links" class="panel">
          <div
            id="gridArea"
            class="content-grid"
            role="list"
            aria-label="cards"
          ></div>
          <div
            id="listArea"
            class="list-view"
            role="list"
            aria-label="list"
          ></div>

          <div class="pagination" aria-label="pagination">
            <button id="prevBtn" class="btn-small">前へ</button>
            <div class="muted" style="min-width: 140px; text-align: center">
              ページ <span id="pageNum">1</span> / <span id="pageTotal">1</span>
            </div>
            <button id="nextBtn" class="btn-small">次へ</button>
          </div>
        </section>
      </main>

      <footer>© <span id="year"></span> NEXUS — Crafted by SoraFlete</footer>

      <div id="imgModal" class="modal" role="dialog" aria-hidden="true">
        <img id="modalImg" alt="preview image" />
      </div>
    </div>

    <script>
      (function () {
        // default set to the requested nemonowa path
        const DEFAULT_OWNER = "nemonowa";
        const DEFAULT_REPO = "nemonowa.github.io";
        const DEFAULT_PATH = "source/page";

        const state = {
          owner: DEFAULT_OWNER,
          repo: DEFAULT_REPO,
          path: DEFAULT_PATH,
          items: [],
          page: 1,
          perPage: 10,
        };

        // DOM
        const ownerEl = document.getElementById("owner");
        const repoEl = document.getElementById("repo");
        const pathEl = document.getElementById("path");
        const fetchBtn = document.getElementById("fetchBtn");
        const loadDemoBtn = document.getElementById("loadDemo");
        const gridArea = document.getElementById("gridArea");
        const listArea = document.getElementById("listArea");
        const countEl = document.getElementById("count");
        const lastUpdatedEl = document.getElementById("lastUpdated");
        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");
        const pageNumEl = document.getElementById("pageNum");
        const pageTotalEl = document.getElementById("pageTotal");
        const imgModal = document.getElementById("imgModal");
        const modalImg = document.getElementById("modalImg");

        document.getElementById("year").textContent = new Date().getFullYear();

        function extOf(name) {
          return (name.split(".").pop() || "").toLowerCase();
        }
        function basename(name) {
          return name.replace(/\.[^/.]+$/, "");
        }

        function render() {
          const items = state.items;
          countEl.textContent = items.length;
          const totalPages = Math.max(
            1,
            Math.ceil(items.length / state.perPage)
          );
          pageTotalEl.textContent = totalPages;
          pageNumEl.textContent = state.page;

          // last updated
          if (items.length > 0) {
            const latest = items
              .slice()
              .sort(
                (a, b) =>
                  new Date(b.updated_at || 0) - new Date(a.updated_at || 0)
              )[0];
            lastUpdatedEl.textContent = latest.updated_at
              ? new Date(latest.updated_at).toLocaleString()
              : "--";
          } else lastUpdatedEl.textContent = "--";

          const start = (state.page - 1) * state.perPage;
          const pageItems = items.slice(start, start + state.perPage);
          gridArea.innerHTML = "";
          listArea.innerHTML = "";

          pageItems.forEach((it) => {
            const card = document.createElement("article");
            card.className = "card";

            // click on card => REDIRECT to GitHub Pages served URL for that path
            card.addEventListener("click", (e) => {
              // don't redirect when clicking specific inner controls
              if (
                e.target.closest(".open-file") ||
                e.target.closest(".thumb") ||
                e.target.closest(".meta")
              )
                return;
              // Construct Pages URL: https://<repo-host>/<file-path>
              // For nemonowa.github.io, files under 'source/page/foo.html' are served at /source/page/foo.html
              const pagesUrl = `https://${state.repo.replace(
                /\/$/,
                ""
              )}/${encodeURI(it.path)}`;
              // navigate current window (redirect)
              window.location.href = pagesUrl;
            });

            const thumb = document.createElement("div");
            thumb.className = "thumb";
            if (it.image) {
              const img = document.createElement("img");
              img.src = it.image;
              img.alt = it.name;
              img.addEventListener("click", (ev) => {
                ev.stopPropagation();
                modalImg.src = it.image;
                imgModal.style.display = "flex";
                imgModal.setAttribute("aria-hidden", "false");
              });
              thumb.appendChild(img);
            } else {
              thumb.innerHTML =
                '<div style="padding:8px;color:var(--muted);font-size:0.9rem">No image</div>';
            }

            const title = document.createElement("div");
            title.innerHTML =
              '<strong style="display:block;margin:6px 0;font-size:1rem">' +
              it.name +
              '</strong><div class="muted" style="font-size:0.9rem;min-height:36px">' +
              (it.desc || "") +
              "</div>";

            const metaRow = document.createElement("div");
            metaRow.className = "meta";
            const left = document.createElement("div");
            left.className = "muted";
            left.textContent = it.author || "";
            const right = document.createElement("div");
            right.className = "muted";
            right.textContent = it.updated_at
              ? new Date(it.updated_at).toLocaleDateString()
              : "--";
            metaRow.appendChild(left);
            metaRow.appendChild(right);

            const openLink = document.createElement("a");
            openLink.href = it.html_url || it.download_url || "#";
            openLink.target = "_blank";
            openLink.rel = "noopener noreferrer";
            openLink.className = "open-file";
            openLink.textContent = "Open file";
            openLink.style.cssText =
              "font-size:0.85rem;color:var(--accent);text-decoration:none;margin-top:8px;display:inline-block";

            card.appendChild(thumb);
            card.appendChild(title);
            card.appendChild(metaRow);
            card.appendChild(openLink);
            gridArea.appendChild(card);

            const li = document.createElement("div");
            li.className = "list-item";
            li.innerHTML =
              '<div><a href="' +
              (it.html_url || "#") +
              '" target="_blank" rel="noopener noreferrer">' +
              it.name +
              '</a><div class="muted" style="font-size:0.85rem">' +
              (it.desc || "") +
              '</div></div><div style="text-align:right"><div class="muted">' +
              (it.updated_at
                ? new Date(it.updated_at).toLocaleString()
                : "--") +
              "</div></div>";
            listArea.appendChild(li);
          });

          prevBtn.disabled = state.page <= 1;
          nextBtn.disabled =
            state.page >= totalPages || state.items.length === 0;
        }

        // fetch from GitHub API (non-recursive)
        async function fetchFromGitHub(owner, repo, path) {
          const apiBase = "https://api.github.com";
          try {
            const url = `${apiBase}/repos/${owner}/${repo}/contents/${encodeURIComponent(
              path
            )}`;
            const res = await fetch(url);
            if (!res.ok)
              throw new Error("Contents fetch failed: " + res.status);
            const contents = await res.json();
            const files = Array.isArray(contents) ? contents : [];
            const imageExts = ["png", "jpg", "jpeg", "webp", "gif", "svg"];
            const images = {};
            files.forEach((f) => {
              const e = extOf(f.name);
              if (imageExts.includes(e))
                images[basename(f.name)] =
                  f.download_url || f.html_url || f.url;
            });
            const htmlFiles = files.filter((f) =>
              ["html", "htm", "md"].includes(extOf(f.name))
            );
            const items = [];
            for (const f of htmlFiles) {
              const it = {
                name: f.name,
                path: f.path,
                html_url: f.html_url || f.download_url || "",
                download_url: f.download_url || "",
                desc: "",
                author: "",
                updated_at: "",
                image: null,
              };
              const base = basename(f.name);
              if (images[base]) it.image = images[base];
              if (!it.image) {
                for (const [k, v] of Object.entries(images)) {
                  if (k.startsWith(base) || base.startsWith(k)) {
                    it.image = v;
                    break;
                  }
                }
              }
              try {
                const commitsRes = await fetch(
                  `${apiBase}/repos/${owner}/${repo}/commits?path=${encodeURIComponent(
                    f.path
                  )}&per_page=1`
                );
                if (commitsRes.ok) {
                  const commits = await commitsRes.json();
                  if (Array.isArray(commits) && commits.length > 0) {
                    const c = commits[0];
                    it.updated_at =
                      c.commit && c.commit.committer && c.commit.committer.date
                        ? c.commit.committer.date
                        : "";
                    it.author =
                      c.commit && c.commit.author && c.commit.author.name
                        ? c.commit.author.name
                        : c.author && c.author.login
                        ? c.author.login
                        : "";
                    it.desc =
                      c.commit && c.commit.message
                        ? c.commit.message.split("\n")[0]
                        : "";
                  }
                }
              } catch (e) {
                // ignore commit fetch errors
              }
              items.push(it);
            }
            items.sort(
              (a, b) =>
                new Date(b.updated_at || 0) - new Date(a.updated_at || 0)
            );
            state.owner = owner;
            state.repo = repo;
            state.path = path;
            state.items = items;
            state.page = 1;
            render();
          } catch (err) {
            console.error(err);
            alert("GitHub 取得に失敗しました（コンソール参照）");
          }
        }

        function loadDemo() {
          const DEMO = [];
          for (let i = 1; i <= 18; i++) {
            DEMO.push({
              name: `demo-${i}.html`,
              path: `source/page/demo-${i}.html`,
              html_url: "#",
              download_url: "#",
              desc: `デモ記事 ${i}`,
              author: "demo",
              updated_at: new Date(Date.now() - i * 86400000).toISOString(),
              image: `https://picsum.photos/seed/demo${i}/256/256`, //ここで読み込む画像サイズを調整
            });
          }
          state.items = DEMO;
          state.page = 1;
          render();
        }

        // events
        fetchBtn.addEventListener("click", () => {
          const owner = (ownerEl.value || "").trim() || DEFAULT_OWNER;
          const repo = (repoEl.value || "").trim() || DEFAULT_REPO;
          const path = (pathEl.value || "").trim() || DEFAULT_PATH;
          fetchFromGitHub(owner, repo, path);
        });
        loadDemoBtn.addEventListener("click", () => loadDemo());
        prevBtn.addEventListener("click", () => {
          if (state.page > 1) {
            state.page--;
            render();
          }
        });
        nextBtn.addEventListener("click", () => {
          const totalPages = Math.ceil(state.items.length / state.perPage) || 1;
          if (state.page < totalPages) {
            state.page++;
            render();
          }
        });
        imgModal.addEventListener("click", () => {
          imgModal.style.display = "none";
          imgModal.setAttribute("aria-hidden", "true");
          modalImg.src = "";
        });

        // logo easter
        (function () {
          const logo = document.getElementById("logo");
          let clicks = 0,
            t;
          logo.addEventListener("click", () => {
            clicks++;
            if (t) clearTimeout(t);
            t = setTimeout(() => (clicks = 0), 1200);
            if (clicks >= 5) {
              clicks = 0;
              alert("詩: 星は鍵、沈黙は扉。歩め、光の欠片を数えよ。");
            }
          });
        })();

        // INITIAL: auto-fetch the requested nemonowa path
        (function init() {
          ownerEl.value = DEFAULT_OWNER;
          repoEl.value = DEFAULT_REPO;
          pathEl.value = DEFAULT_PATH;
          // attempt to fetch GitHub API contents for the path
          fetchFromGitHub(DEFAULT_OWNER, DEFAULT_REPO, DEFAULT_PATH);
        })();

        // expose for debug
        window.NEXUS_INDEX = { state, render, fetchFromGitHub };
      })();
    </script>
  </body>
</html>
