<!DOCTYPE html>
<html lang="ja">
  <head>
    <link rel="stylesheet" href="https://nemonowa.github.io/styles.css" />
    <meta charset="UTF-8" />
    <title>図形ジェネレーター（NeoShapeGenerator）</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        font-family: sans-serif;
        display: flex;
        flex-direction: row;
        align-items: flex-start;
        padding: 1vw;
        background-color: #fff;
        color: #000;
      }
      body.dark {
        background-color: #1e1e1e;
        color: #ddd;
      }
      #controls {
        display: flex;
        flex-direction: column;
        margin-right: 1vw;
        width: 20vw;
        min-width: 200px;
      }
      #controls label {
        margin: 0.5vh 0 0.2vh;
        font-weight: bold;
        font-size: 0.9rem;
      }
      input[type="number"],
      input[type="color"],
      input[type="range"],
      select {
        width: 100%;
        margin-bottom: 0.8vh;
      }
      canvas {
        border: 1px solid #999;
        cursor: grab;
        flex-grow: 0;
        width: auto;
        height: auto;
        background: transparent;
      }
      button {
        margin-top: 0.5vh;
        padding: 0.5vh;
        cursor: pointer;
      }
      #topButtons {
        display: flex;
        flex-direction: column;
        margin-bottom: 1vh;
      }
      #bottomButtons {
        margin-top: auto;
      }
    </style>
  </head>
  <body>
    <div id="controls">
      <div id="topButtons">
        <label>保存形式</label>
        <select id="format">
          <option value="png">PNG (透過)</option>
          <option value="pngbg">PNG (背景色付き)</option>
          <option value="jpeg">JPEG</option>
          <option value="webp">WebP</option>
        </select>
        <button onclick="saveImage()">保存</button>
      </div>

      <label>サイズ(px)</label>
      <input type="number" id="size" value="512" />

      <label>背景色</label>
      <input type="color" id="bgcolor" value="#ffffff" />

      <label>グラデ色1</label>
      <input type="color" id="color1" value="#1e28d2" />

      <label>グラデ色2</label>
      <input type="color" id="color2" value="#87070f" />

      <label>形状</label>
      <input type="range" id="vertices" min="0" max="12" value="2" />
      <div id="verticesDisplay">2</div>

      <label>図形回転角度</label>
      <input type="range" id="shapeAngle" min="0" max="360" value="0" />
      <div id="shapeAngleDisplay">0°</div>

      <label>グラデーション角度</label>
      <input type="range" id="gradAngle" min="0" max="360" value="135" />
      <div id="gradAngleDisplay">135°</div>

      <label>楕円補正 X</label>
      <input type="range" id="scaleX" min="0.1" max="2" step="0.01" value="1" />
      <div id="scaleXDisplay">1.00</div>

      <label>楕円補正 Y</label>
      <input type="range" id="scaleY" min="0.1" max="2" step="0.01" value="1" />
      <div id="scaleYDisplay">1.00</div>

      <label>角丸化：ベジェ補正</label>
      <input type="range" id="bezier" min="0" max="1" step="0.01" value="0" />
      <div id="bezierDisplay">0.00</div>

      <div id="bottomButtons">
        <button onclick="toggleTheme()">テーマ切替</button>
        <button onclick="resetDefaults()">リセット</button>
      </div>
      <div id="ui"></div>

      <!-- 保守性のために外部から読み込み -->
      <script src="https://nemonowa.github.io/scripts.js"></script>
    </div>
    <canvas id="canvas"></canvas>

    <script>
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      const DEFAULTS = {
        size: 512,
        bgcolor: "#ffffff",
        color1: "#1E28D2",
        color2: "#87070f",
        vertices: 2,
        shapeAngle: 0,
        gradAngle: 135,
        scaleX: 1,
        scaleY: 1,
        bezier: 0,
        theme: "dark",
      };

      let size = DEFAULTS.size;
      let bgcolor = DEFAULTS.bgcolor;
      let color1 = DEFAULTS.color1;
      let color2 = DEFAULTS.color2;
      let vertices = DEFAULTS.vertices;
      let shapeAngle = DEFAULTS.shapeAngle;
      let gradAngle = DEFAULTS.gradAngle;
      let scaleX = DEFAULTS.scaleX;
      let scaleY = DEFAULTS.scaleY;
      let bezier = DEFAULTS.bezier;
      let theme = DEFAULTS.theme;

      function drawGrid() {
        const grid = document.createElement("canvas");
        grid.width = window.innerWidth;
        grid.height = window.innerHeight;
        const gctx = grid.getContext("2d");

        const gridSize = Math.max(4, Math.round(window.innerWidth * 0.1));
        const lineWidth = Math.max(1, window.innerWidth * 0.001);

        gctx.clearRect(0, 0, grid.width, grid.height);
        gctx.strokeStyle = "#a0c4ff";
        if (theme === "dark") gctx.strokeStyle = "#063931";
        gctx.lineWidth = lineWidth;

        for (let x = 0; x <= grid.width; x += gridSize) {
          gctx.beginPath();
          gctx.moveTo(x, 0);
          gctx.lineTo(x, grid.height);
          gctx.stroke();
        }
        for (let y = 0; y <= grid.height; y += gridSize) {
          gctx.beginPath();
          gctx.moveTo(0, y);
          gctx.lineTo(grid.width, y);
          gctx.stroke();
        }

        document.body.style.backgroundImage = `url(${grid.toDataURL()})`;
        document.body.style.backgroundRepeat = "repeat";
      }

      function drawShape(format = "png") {
        canvas.width = size;
        canvas.height = size;
        canvas.style.width = size + "px";
        canvas.style.height = size + "px";

        // 背景を描画するのは pngbg / jpeg / webp のみ
        if (format === "pngbg" || format === "jpeg" || format === "webp") {
          ctx.fillStyle = bgcolor;
          ctx.fillRect(0, 0, size, size);
        } else {
          ctx.clearRect(0, 0, size, size); // 透過用
        }

        if (vertices === 0) return;

        const radGrad = (gradAngle * Math.PI) / 180;
        const cx = size / 2;
        const cy = size / 2;
        const diag = Math.sqrt(size * size + size * size) / 2;

        const x1 = cx - Math.cos(radGrad) * diag;
        const y1 = cy - Math.sin(radGrad) * diag;
        const x2 = cx + Math.cos(radGrad) * diag;
        const y2 = cy + Math.sin(radGrad) * diag;

        const grad = ctx.createLinearGradient(x1, y1, x2, y2);
        grad.addColorStop(0, color1);
        grad.addColorStop(1, color2);
        ctx.fillStyle = grad;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate((shapeAngle * Math.PI) / 180);
        ctx.scale(scaleX, scaleY);
        ctx.beginPath();

        if (vertices === 1) ctx.rect(-size / 2, -size / 2, size, size);
        else if (vertices === 2) ctx.arc(0, 0, size / 2, 0, Math.PI * 2);
        else {
          const radius = size / 2;
          for (let i = 0; i < vertices; i++) {
            const angle1 = (i / vertices) * Math.PI * 2 - Math.PI / 2;
            const angle2 = ((i + 1) / vertices) * Math.PI * 2 - Math.PI / 2;
            const x1v = radius * Math.cos(angle1);
            const y1v = radius * Math.sin(angle1);
            const x2v = radius * Math.cos(angle2);
            const y2v = radius * Math.sin(angle2);
            const cp1x = x1v + (x2v - x1v) * bezier;
            const cp1y = y1v + (y2v - y1v) * bezier;
            const cp2x = x2v - (x2v - x1v) * bezier;
            const cp2y = y2v - (y2v - y1v) * bezier;
            if (i === 0) ctx.moveTo(x1v, y1v);
            ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, x2v, y2v);
          }
          ctx.closePath();
        }
        ctx.fill();
        ctx.restore();

        document.getElementById("verticesDisplay").textContent = vertices;
        document.getElementById("shapeAngleDisplay").textContent =
          shapeAngle + "°";
        document.getElementById("gradAngleDisplay").textContent =
          gradAngle + "°";
        document.getElementById("scaleXDisplay").textContent =
          scaleX.toFixed(2);
        document.getElementById("scaleYDisplay").textContent =
          scaleY.toFixed(2);
        document.getElementById("bezierDisplay").textContent =
          bezier.toFixed(2);
      }

      window.onload = () => {
        // 初期テーマ反映
        if (theme === "dark") document.body.classList.add("dark");
        else document.body.classList.remove("dark");
        drawGrid();
        drawShape();
        window.addEventListener("resize", drawGrid);

        document.getElementById("size").addEventListener("input", (e) => {
          size = parseInt(e.target.value);
          drawShape();
        });
        document.getElementById("bgcolor").addEventListener("input", (e) => {
          bgcolor = e.target.value;
          drawShape();
        });
        document.getElementById("color1").addEventListener("input", (e) => {
          color1 = e.target.value;
          drawShape();
        });
        document.getElementById("color2").addEventListener("input", (e) => {
          color2 = e.target.value;
          drawShape();
        });
        document.getElementById("vertices").addEventListener("input", (e) => {
          vertices = parseInt(e.target.value);
          drawShape();
        });
        document.getElementById("shapeAngle").addEventListener("input", (e) => {
          shapeAngle = parseInt(e.target.value);
          drawShape();
        });
        document.getElementById("gradAngle").addEventListener("input", (e) => {
          gradAngle = parseInt(e.target.value);
          drawShape();
        });
        document.getElementById("scaleX").addEventListener("input", (e) => {
          scaleX = parseFloat(e.target.value);
          drawShape();
        });
        document.getElementById("scaleY").addEventListener("input", (e) => {
          scaleY = parseFloat(e.target.value);
          drawShape();
        });
        document.getElementById("bezier").addEventListener("input", (e) => {
          bezier = parseFloat(e.target.value);
          drawShape();
        });
      };

      function saveImage() {
        const format = document.getElementById("format").value;
        let mime = "image/png";
        let ext = "png";

        const tempCanvas = document.createElement("canvas");
        tempCanvas.width = size;
        tempCanvas.height = size;
        const tctx = tempCanvas.getContext("2d");

        // 一時キャンバスに描画（透過PNGは背景なし）
        if (format === "pngbg" || format === "jpeg" || format === "webp") {
          tctx.fillStyle = bgcolor;
          tctx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
        }

        // 元canvasを描画
        tctx.drawImage(canvas, 0, 0);

        if (format === "jpeg") {
          mime = "image/jpeg";
          ext = "jpg";
        } else if (format === "webp") {
          mime = "image/webp";
          ext = "webp";
        }

        const link = document.createElement("a");
        link.download = `shape.${ext}`;
        link.href = tempCanvas.toDataURL(mime, 0.9);
        link.click();
      }

      function resetDefaults() {
        size = DEFAULTS.size;
        bgcolor = DEFAULTS.bgcolor;
        color1 = DEFAULTS.color1;
        color2 = DEFAULTS.color2;
        vertices = DEFAULTS.vertices;
        shapeAngle = DEFAULTS.shapeAngle;
        gradAngle = DEFAULTS.gradAngle;
        scaleX = DEFAULTS.scaleX;
        scaleY = DEFAULTS.scaleY;
        bezier = DEFAULTS.bezier;
        theme = DEFAULTS.theme;

        document.getElementById("size").value = size;
        document.getElementById("bgcolor").value = bgcolor;
        document.getElementById("color1").value = color1;
        document.getElementById("color2").value = color2;
        document.getElementById("vertices").value = vertices;
        document.getElementById("shapeAngle").value = shapeAngle;
        document.getElementById("gradAngle").value = gradAngle;
        document.getElementById("scaleX").value = scaleX;
        document.getElementById("scaleY").value = scaleY;
        document.getElementById("bezier").value = bezier;

        if (theme === "dark") document.body.classList.add("dark");
        else document.body.classList.remove("dark");

        drawShape();
        drawGrid();
      }

      function toggleTheme() {
        if (theme === "light") {
          theme = "dark";
          document.body.classList.add("dark");
        } else {
          theme = "light";
          document.body.classList.remove("dark");
        }
        drawGrid();
      }
    </script>
  </body>
</html>
