艦の食事小話【story】
## のわ
誰かのために料理をするのが好き。おやつ作りもかなり上手。ただし人間の尺度で測れない料理を生み出すこともしばしば。好きな食べ物は「どーなつ」
## ねも
食事にあまり重きを置いていない。隙なくば軍用レーションで済ませようとする。ディストピア飯マニア。
## くま
食べ専。「腹減ったんだろ？喰えよw」とか「強くなりたくば喰らえw」とかごちゃごちゃ言ってくるが、出されたものは完食するし、なんでも美味そうに食う。好きな食べ物は「ステーキ(生)」
## かい
食事は必要としないが、人型っぽくなって有機物をエネルギーに変換することも可能。好きな食べ物は「貝」
